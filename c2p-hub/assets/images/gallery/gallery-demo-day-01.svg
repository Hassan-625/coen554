<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="tgallerydemoday01">
  <title id="tgallerydemoday01">Visitors moving between team stands on the Demo Day floor</title>
  <defs>
    <linearGradient id="bggallerydemoday01" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEDFB"/>
    </linearGradient>
    <pattern id="dotsgallerydemoday01" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#DCDEF7"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bggallerydemoday01)"/>
  <rect width="800" height="500" fill="url(#dotsgallerydemoday01)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#DCDEF7"/>

  <g stroke="#1318AB" stroke-width="7" stroke-linejoin="round">
    <path d="M400 74 L560 152 L400 230 L240 152 Z" fill="#ECEDFB"/>
    <path d="M240 200 L400 278 L560 200" fill="none"/>
    <path d="M240 248 L400 326 L560 248" fill="none"/>
  </g>
  <circle cx="400" cy="152" r="20" fill="#1318AB"/>

  <text x="400" y="392" text-anchor="middle" fill="#12131A"
