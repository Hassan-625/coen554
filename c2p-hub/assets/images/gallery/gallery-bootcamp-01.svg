  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#DCDEF7"/>

  <rect x="288" y="96" width="224" height="164" rx="22" fill="#ffffff" stroke="#1318AB" stroke-width="7"/>
  <rect x="336" y="144" width="128" height="68" rx="12" fill="#ECEDFB" stroke="#1318AB" stroke-width="5"/>
