<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">The C2P Tech Hub pipeline: an idea moving through concept, build, incubation and production</title>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEDFB"/>
    </linearGradient>
    <pattern id="heroDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.7" cy="1.7" r="1.7" fill="#DCDEF7"/>
    </pattern>
    <marker id="heroArrow" viewBox="0 0 12 12" refX="9" refY="6"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#1318AB" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#heroBg)"/>
  <rect width="1200" height="560" fill="url(#heroDots)" opacity="0.5"/>

  <!-- connectors between the four stages -->
  <g fill="none" stroke="#1318AB" stroke-width="3" stroke-linecap="round"
     stroke-dasharray="1 13" marker-end="url(#heroArrow)" opacity="0.85">
    <path d="M256 250 H404"/>
    <path d="M536 250 H684"/>
    <path d="M816 250 H964"/>
  </g>

  <!-- STAGE 1 — CONCEPT : a bulb -->
  <circle cx="190" cy="250" r="66" fill="#FFFFFF" stroke="#1318AB" stroke-width="5"/>
  <g fill="none" stroke="#1318AB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 212 a26 26 0 0 1 16 46 v10 h-32 v-10 a26 26 0 0 1 16 -46z"/>
    <path d="M178 280 h24 M182 290 h16"/>
  </g>

  <!-- STAGE 2 — BUILD : a terminal prompt -->
  <circle cx="470" cy="250" r="66" fill="#FFFFFF" stroke="#1318AB" stroke-width="5"/>
  <rect x="436" y="222" width="68" height="56" rx="9" fill="none" stroke="#1318AB" stroke-width="5"/>
  <g fill="none" stroke="#1318AB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M450 240 l12 10 -12 10 M472 262 h18"/>
  </g>

  <!-- STAGE 3 — INCUBATE : nested layers -->
  <circle cx="750" cy="250" r="66" fill="#FFFFFF" stroke="#1318AB" stroke-width="5"/>
  <g fill="none" stroke="#1318AB" stroke-width="5" stroke-linejoin="round">
    <path d="M750 216 L788 238 L750 260 L712 238 Z" fill="#ECEDFB"/>
    <path d="M712 258 L750 280 L788 258"/>
  </g>

  <!-- STAGE 4 — PRODUCTION : a completed check -->
  <circle cx="1030" cy="250" r="66" fill="#1318AB" stroke="#1318AB" stroke-width="5"/>
  <path d="M1006 250 l16 16 30 -32" fill="none" stroke="#FFFFFF" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stage labels -->
  <g text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
    <g font-size="21" font-weight="700" fill="#12131A">
      <text x="190" y="368">Concept</text>
      <text x="470" y="368">Build</text>
      <text x="750" y="368">Incubate</text>
      <text x="1030" y="368">Production</text>
    </g>
    <g font-size="15" font-weight="500" fill="#6E7284">
      <text x="190" y="394">The rough idea</text>
      <text x="470" y="394">Bootcamps &amp; sessions</text>
      <text x="750" y="394">Cohort &amp; mentorship</text>
      <text x="1030" y="394">Shipped &amp; demonstrated</text>
    </g>
  </g>

  <!-- progress rail -->
  <rect x="190" y="438" width="840" height="8" rx="4" fill="#DCDEF7"/>
  <rect x="190" y="438" width="840" height="8" rx="4" fill="#1318AB"/>
  <g fill="#FFFFFF" stroke="#1318AB" stroke-width="4">
    <circle cx="190" cy="442" r="9"/>
    <circle cx="470" cy="442" r="9"/>
    <circle cx="750" cy="442" r="9"/>
    <circle cx="1030" cy="442" r="9"/>
  </g>

  <!-- No PLACEHOLDER badge here, deliberately: unlike the photo placeholders
       in projects/, events/ and gallery/, this diagram is the intended final
       artwork for the hero slot. It is not waiting to be swapped for a photo.
       The top corners are also left clear so the floating annotation cards
       positioned over this figure by responsive.css do not collide with it. -->
</svg>
