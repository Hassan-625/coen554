<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="tprojectsaferoute">
  <title id="tprojectsaferoute">A phone showing the SafeRoute shuttle tracking map at a campus bus stop</title>
  <defs>
    <linearGradient id="bgprojectsaferoute" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEDFB"/>
    </linearGradient>
    <pattern id="dotsprojectsaferoute" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#DCDEF7"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgprojectsaferoute)"/>
  <rect width="800" height="500" fill="url(#dotsprojectsaferoute)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#DCDEF7"/>

  <path d="M232 288 C 300 288 292 176 360 176 C 428 176 420 262 488 262 C 540 262 548 150 570 128"
        fill="none" stroke="#1318AB" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22"/>
  <g fill="#1318AB">
    <path d="M232 288 c0 0 -30 -34 -30 -54 a30 30 0 1 1 60 0 c0 20 -30 54 -30 54z"/>
  </g>
  <circle cx="232" cy="232" r="12" fill="#ffffff"/>
  <g fill="none" stroke="#1318AB" stroke-width="7">
    <circle cx="570" cy="128" r="26"/>
  </g>
  <circle cx="570" cy="128" r="10" fill="#1318AB"/>
  <rect x="330" y="140" width="120" height="76" rx="14" fill="#ffffff" stroke="#1318AB" stroke-width="6"/>
  <g stroke="#1318AB" stroke-width="6" stroke-linecap="round">
    <path d="M354 168 h72 M354 190 h44"/>
  </g>

  <text x="400" y="392" text-anchor="middle" fill="#12131A"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.5">SafeRoute ABU</text>
  <text x="400" y="428" text-anchor="middle" fill="#6E7284"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="19" font-weight="500">Live campus shuttle tracking</text>

  <g>
    <rect x="596" y="28" width="176" height="34" rx="17" fill="#FFFFFF" stroke="#DCDEF7"/>
    <circle cx="618" cy="45" r="5" fill="#1318AB"/>
    <text x="632" y="51" fill="#6E7284"
          font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
          font-size="14" font-weight="700" letter-spacing="1.2">PLACEHOLDER</text>
  </g>
</svg>