<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="tprojecthausaspeech">
  <title id="tprojecthausaspeech">A student recording spoken Hausa at a laptop workstation</title>
  <defs>
    <linearGradient id="bgprojecthausaspeech" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEDFB"/>
    </linearGradient>
    <pattern id="dotsprojecthausaspeech" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#DCDEF7"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgprojecthausaspeech)"/>
  <rect width="800" height="500" fill="url(#dotsprojecthausaspeech)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#DCDEF7"/>

  <g fill="#1318AB">
    <rect x="212" y="176" width="18" height="58" rx="9"/>
    <rect x="248" y="146" width="18" height="118" rx="9"/>
    <rect x="284" y="106" width="18" height="198" rx="9"/>
    <rect x="320" y="160" width="18" height="90" rx="9"/>
    <rect x="356" y="80"  width="18" height="250" rx="9"/>
    <rect x="392" y="132" width="18" height="146" rx="9"/>
    <rect x="428" y="96"  width="18" height="218" rx="9"/>
    <rect x="464" y="164" width="18" height="82" rx="9"/>
    <rect x="500" y="120" width="18" height="170" rx="9"/>
    <rect x="536" y="168" width="18" height="74" rx="9"/>
    <rect x="572" y="184" width="18" height="42" rx="9"/>
  </g>

  <text x="400" y="392" text-anchor="middle" fill="#12131A"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.5">HausaSpeech</text>
  <text x="400" y="428" text-anchor="middle" fill="#6E7284"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="19" font-weight="500">Open speech corpus and recognition model</text>

  <g>
    <rect x="596" y="28" width="176" height="34" rx="17" fill="#FFFFFF" stroke="#DCDEF7"/>
    <circle cx="618" cy="45" r="5" fill="#1318AB"/>
    <text x="632" y="51" fill="#6E7284"
          font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
          font-size="14" font-weight="700" letter-spacing="1.2">PLACEHOLDER</text>
  </g>
</svg>