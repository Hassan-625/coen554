<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="tprojectagrisense">
  <title id="tprojectagrisense">A solar-powered soil sensor node staked into farmland</title>
  <defs>
    <linearGradient id="bgprojectagrisense" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEDFB"/>
    </linearGradient>
    <pattern id="dotsprojectagrisense" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#DCDEF7"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgprojectagrisense)"/>
  <rect width="800" height="500" fill="url(#dotsprojectagrisense)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="799" height="499" fill="none" stroke="#DCDEF7"/>

  <g fill="none" stroke="#1318AB" stroke-width="7" stroke-linecap="round">
