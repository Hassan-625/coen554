    <circle cx="566" cy="153" r="21"/>
    <circle cx="548" cy="209" r="21"/>
  </g>
  <g fill="#1318AB">
    <rect x="286" y="120" width="118" height="20" rx="10"/>
    <rect x="286" y="164" width="118" height="20" rx="10"/>
  </g>

  <text x="400" y="392" text-anchor="middle" fill="#12131A"
